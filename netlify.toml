# Netlify hosts ONLY the static game client (client/dist).
# The real-time multiplayer server must run on a persistent Node.js host
# (see README → "Deploying the game server"). Set VITE_GAME_SERVER_URL in the
# Netlify UI to that server's wss:// URL before building.

[build]
  command = "npm run build:client"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app fallback (invite links like /?party=AB2CD and deep links).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # No third-party origins: everything is self-hosted. WebSockets may go to any wss:// game server.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
